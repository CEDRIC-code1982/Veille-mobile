# Source of truth for every watched source.
#
# `official` says the publisher is first-party for its own product; it drives
# duplicate resolution. It is NOT what authorises a blocking item: that is
# decided only by config/official-domains.json.
#
# `maxAgeDays` is the silence threshold. For rss and atom sources it applies to
# the newest published entry; for scrape sources it applies to the last
# successful read, because a documentation page that does not change is normal.
#
# Run `npm run check:feeds` after any edit: a URL that does not answer must be
# removed, never replaced by a plausible guess.
feeds:
  - name: React Native Blog
    url: https://reactnative.dev/blog/rss.xml
    type: rss
    domain: reactnative.dev
    categories: [react-native]
    official: true
    maxAgeDays: 90

  - name: React Native Releases
    url: https://github.com/facebook/react-native/releases.atom
    type: atom
    domain: github.com
    categories: [react-native]
    official: true
    maxAgeDays: 60

  # github.com/expo/expo/releases.atom answers but carries no entry: Expo tags
  # its releases without publishing GitHub releases. The changelog page is the
  # real source, so it is scraped.
  - name: Expo Changelog
    url: https://expo.dev/changelog
    type: scrape
    domain: expo.dev
    categories: [react-native, tooling]
    official: true
    maxAgeDays: 14

  - name: This Week in React
    url: https://thisweekinreact.com/newsletter/rss.xml
    type: rss
    domain: thisweekinreact.com
    categories: [react-native, typescript]
    official: false
    maxAgeDays: 21

  - name: TypeScript Dev Blog
    url: https://devblogs.microsoft.com/typescript/feed/
