# Source of truth for every watched source.
#
# `official` says the publisher is first-party for its own product; it drives
# duplicate resolution. It is NOT what authorises a blocking item: that is
# decided only by config/official-domains.json.
#
# `maxAgeDays` is the silence threshold. For rss and atom sources it applies to
# the newest published entry; for scrape sources it applies to the last
# successful read, because a documentation page that does not change is normal.
#
# Run `npm run check:feeds` after any edit: a URL that does not answer must be
# removed, never replaced by a plausible guess.
feeds:
  - name: React Native Blog
    url: https://reactnative.dev/blog/rss.xml
    type: rss
    domain: reactnative.dev
    categories: [react-native]
    official: true
    maxAgeDays: 90

  - name: React Native Releases
    url: https://github.com/facebook/react-native/releases.atom
    type: atom
    domain: github.com
    categories: [react-native]
    official: true
    maxAgeDays: 60

  # github.com/expo/expo/releases.atom answers but carries no entry: Expo tags
  # its releases without publishing GitHub releases. The changelog page is the
  # real source, so it is scraped.
  - name: Expo Changelog
    url: https://expo.dev/changelog
    type: scrape
    domain: expo.dev
    categories: [react-native, tooling]
    official: true
    maxAgeDays: 14

  - name: This Week in React
    url: https://thisweekinreact.com/newsletter/rss.xml
    type: rss
    domain: thisweekinreact.com
    categories: [react-native, typescript]
    official: false
    maxAgeDays: 21

  - name: TypeScript Dev Blog
    url: https://devblogs.microsoft.com/typescript/feed/
    type: rss
    domain: devblogs.microsoft.com
    categories: [typescript]
    official: true
    maxAgeDays: 90

  - name: TypeScript Releases
    url: https://github.com/microsoft/TypeScript/releases.atom
    type: atom
    domain: github.com
    categories: [typescript]
    official: true
    maxAgeDays: 90

  - name: Apple Developer News
    url: https://developer.apple.com/news/rss/news.rss
    type: rss
    domain: developer.apple.com
    categories: [ios, policy]
    official: true
    maxAgeDays: 21

  - name: App Store Review Guidelines
    url: https://developer.apple.com/app-store/review/guidelines/
    type: scrape
    domain: developer.apple.com
    categories: [ios, policy]
    official: true
    maxAgeDays: 7

  - name: Apple Newsroom
    url: https://www.apple.com/newsroom/rss-feed.rss
    type: rss
    domain: apple.com
    categories: [hardware, ios]
    official: true
    maxAgeDays: 21

  - name: Android Developers Blog
    url: https://android-developers.googleblog.com/feeds/posts/default
    type: atom
    domain: android-developers.googleblog.com
    categories: [android, policy]
    official: true
    maxAgeDays: 21

  - name: Android Target API Level Requirements
    url: https://developer.android.com/google/play/requirements/target-sdk
    type: scrape
    domain: developer.android.com
    categories: [android, policy, background]
    official: true
    maxAgeDays: 7

  - name: Android Platform Versions
    url: https://developer.android.com/about/versions
    type: scrape
    domain: developer.android.com
    categories: [android, background]
    official: true
    maxAgeDays: 7

  - name: Android Studio Releases
    url: https://developer.android.com/studio/releases
    type: scrape
    domain: developer.android.com
    categories: [android, tooling]
    official: true
    maxAgeDays: 7

  - name: Play Console Policy Updates
    url: https://support.google.com/googleplay/android-developer/answer/9934569
    type: scrape
    domain: support.google.com
    categories: [android, policy]
    official: true
    maxAgeDays: 7

  - name: Android and Pixel Blog
    url: https://blog.google/products/android/rss/
    type: rss
    domain: blog.google
    categories: [android, hardware]
    official: true
    maxAgeDays: 21

  # Discovers the two most recent platform versions from the index, then scrapes
  # their behaviour-change pages. No version number is written down anywhere:
  # keeping two of them is what gives the current release and the one it
  # replaces, side by side.
  - name: Android Behavior Changes
    url: https://developer.android.com/about/versions
    type: scrape
    domain: developer.android.com
    categories: [android, os-release, background]
    official: true
    maxAgeDays: 30
    follow:
      linkPattern: '^/about/versions/(\d+)$'
      urlTemplate: /about/versions/{key}/behavior-changes-all
      limit: 2

  # This feed announces every platform Apple ships, and most entries carry no
  # text at all beyond "View downloads": the payload is the title. Narrowed to
  # the platforms this watch is about, so the rest does not drown the signal.
  - name: Apple Developer Releases
    url: https://developer.apple.com/news/releases/rss/releases.rss
    type: rss
    domain: developer.apple.com
    categories: [ios, os-release, tooling]
    official: true
    maxAgeDays: 14
    titlePattern: '^(iOS|iPadOS|Xcode|App Store Connect|TestFlight)\b'

  - name: Apple Security Releases
    url: https://support.apple.com/en-us/100100
    type: scrape
    domain: support.apple.com
    categories: [ios, os-release]
    official: true
    maxAgeDays: 30

  - name: Play Services Releases
    url: https://developers.google.com/android/guides/releases
    type: scrape
    domain: developers.google.com
    categories: [android, tooling]
    official: true
    maxAgeDays: 30

  - name: Bluetooth SIG Blog
    url: https://www.bluetooth.com/blog/feed/
    type: rss
    domain: bluetooth.com
    categories: [ble, hardware]
    official: false
    maxAgeDays: 45

  - name: Don't Kill My App
    url: https://dontkillmyapp.com/
    type: scrape
    domain: dontkillmyapp.com
    categories: [android, background]
    official: false
    maxAgeDays: 14
