# Watch pipeline, manual fallback.
#
# The daily run is driven by a scheduled routine, which is also what performs the
# classification: see the README. This workflow stays as a manual fallback, for
# instance to force a collection from a phone, and it is what proves the pipeline
# still works end to end.
#
# It has no cron on purpose: two drivers would fight over the same data. Silent
# failure is watched by watchdog.yml instead.
#
# Without ANTHROPIC_API_KEY the classify step degrades every item to
# background/unverified rather than failing, so this fallback works with no
# credential at all.
#
# The four stages are four separate steps on purpose: when something breaks, the
# GitHub UI has to say which one.
name: collect

on:
  workflow_dispatch:
    inputs:
      classify:
        description: 'Run the classification step (needs ANTHROPIC_API_KEY)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  # Needed to dispatch deploy.yml: a push made with GITHUB_TOKEN never triggers
  # a workflow, but workflow_dispatch is documented as always creating a run.
  actions: write

concurrency:
  group: veille-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect
        run: npm run collect
        env:
          VEILLE_USER_AGENT: veille-mobile-bot (+${{ github.server_url }}/${{ github.repository }})

      - name: Classify
        if: ${{ inputs.classify }}
        run: npm run classify
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Without a classification step there is no proposals file, so every item
      # degrades to background/unverified. That is a deliberate, honest fallback.
      - name: Classify without a model
        if: ${{ !inputs.classify }}
        run: npm run classify:file

      - name: Verify
        run: npm run verify
        env:
          VEILLE_USER_AGENT: veille-mobile-bot (+${{ github.server_url }}/${{ github.repository }})

      - name: Publish
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Screening happens before the data is committed, not after: on a public
      # repository, a forbidden term pushed once is public forever.
      - name: Privacy check before committing
        run: npm run check:privacy -- --require-terms
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

      - name: Commit the data
        id: commit
        run: |
          git config user.name 'veille-bot'
          git config user.email 'veille-bot@users.noreply.github.com'
          git add data/items data/index.json digest
          if git diff --staged --quiet; then
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            echo 'no data change, nothing to commit'
          else
            git commit -m 'data: daily watch update'
            git push
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          fi
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

      # This push was made with GITHUB_TOKEN, so it triggers nothing by itself.
      # A push from the scheduled routine uses a personal key and does trigger
      # the deployment; this step is what makes the manual fallback behave the
      # same way.
      - name: Deploy the site when the data changed
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
